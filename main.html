<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT 1.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        align-items: center;
    }
    .chat-container {
        width: 90%;
        max-width: 400px;
        background: linear-gradient(to bottom, #4e8cff, #007bff);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
        max-height: 400px;
        display: flex;
        flex-direction: column-reverse;
    }
    .chat-message {
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 10px;
    }
    .user-message {
        background-color: #f2f2f2;
        text-align: right;
        color: #333;
    }
    .bot-message {
        background-color: #e6e6ff;
        text-align: left;
        color: #333;
    }
    .input-container {
        width: 90%;
        max-width: 400px;
        display: flex;
        align-items: center;
        margin-top: 10px;
    }
    .input-container input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .input-container button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        margin-left: 10px;
    }
    .typing-indicator {
        display: none;
        color: white;
        font-style: italic;
        margin-top: 5px;
    }
</style>
</head>
<body>
    <div class="chat-container" id="chat-container">
        <div class="typing-indicator" id="typing-indicator">Respondendo...</div>
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Digite uma palavra..." oninput="validarEntrada()" onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        function validarEntrada() {
            const inputField = document.getElementById("user-input");
            if (inputField.value.includes(" ")) {
                Toastify({
                    text: "Digite apenas uma palavra!",
                    duration: 2000,
                    gravity: "bottom",
                    position: "left",
                    backgroundColor: "#ff0000"
                }).showToast();
                inputField.value = inputField.value.replace(/\s/g, "");
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const userInput = inputField.value.trim();

            if (userInput !== "") {
                inputField.value = "";
                const textoCorrigido = await corrigir(userInput);
                if (textoCorrigido.trim() !== "") {
                    const chatContainer = document.getElementById('chat-container');
                    const userMessage = '<div class="chat-message user-message">' + textoCorrigido + '</div>';
                    chatContainer.innerHTML = userMessage + chatContainer.innerHTML;

                    Toastify({
                        text: 'Pesquisando ...',
                        duration: 3000,
                        close: true,
                        gravity: 'bottom',
                        position: 'left',
                        backgroundColor: '#007bff'
                    }).showToast();

                    const typingIndicator = document.getElementById('typing-indicator');
                    typingIndicator.style.display = 'block';

                    try {
                        const wikiText = await buscarWikipedia(textoCorrigido);
                        typingIndicator.style.display = 'none';

                        const botResponse = '<div class="chat-message bot-message">' + wikiText + '</div>';
                        chatContainer.innerHTML = botResponse + chatContainer.innerHTML;
                    } catch (error) {
                        typingIndicator.style.display = 'none';
                        console.error('Erro ao buscar resultados da pesquisa:', error);
                        const errorMessage = '<div class="chat-message bot-message">Erro ao buscar informações.</div>';
                        chatContainer.innerHTML = errorMessage + chatContainer.innerHTML;
                    }
                }
            }
        }

        async function buscarWikipedia(termo) {
            try {
                const response = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
                if (!response.ok) throw new Error('Erro ao acessar a Wikipedia');

                const data = await response.json();
                return data.extract ? data.extract.split('. ')[0] + '.' : "Nenhuma informação encontrada.";
            } catch (error) {
                console.error('Erro ao buscar Wikipedia:', error);
                return "Não foi possível encontrar informações.";
            }
        }

        async function corrigir(textoOriginal) {
            const response = await fetch('https://languagetool.org/api/v2/check', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `language=pt-BR&text=${encodeURIComponent(textoOriginal)}`,
            });
            const data = await response.json();
            let textoCorrigido = textoOriginal;
            data.matches.forEach(match => {
                const correcao = match.replacements[0].value;
                const posicaoInicio = match.offset;
                const posicaoFim = match.offset + match.length;
                textoCorrigido = textoCorrigido.substring(0, posicaoInicio) + correcao + textoCorrigido.substring(posicaoFim);
            });

            return textoCorrigido;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
